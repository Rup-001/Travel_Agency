name: Backend Production Deployment

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    types: [closed]

jobs:
  deploy:
    # শুধু যখন PR merge হয় অথবা সরাসরি main এ push হয় তখনই deploy হবে
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy Backend to Production EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "🚀 Starting Backend Production Deployment..."

            cd /var/www/TravelAgency/Backend        # ← এই পাথটা তোমার আসল পাথ অনুসারে ঠিক করো

            echo "📥 Pulling latest code from main..."
            git checkout main
            git pull origin main

            echo "🏗️ Rebuilding and restarting Docker..."
            docker compose -f docker-compose.prod.yml up --build -d

            echo "🧹 Cleaning old Docker images..."
            docker image prune -f

            echo "✅ Backend Production Deployment Completed Successfully!"